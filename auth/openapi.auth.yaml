openapi: 3.0.3
info:
  title: Incubadora Universitaria 4A - Tiendas online para emprendedores
  version: 1.0.0
  description: |
    API de la incubadora universitaria 4A para tiendas online para emprendedores. 
    Esta API permite gestionar tiendas y productos. 
servers:
  - url: http://localhost:8000
    description: Gateway (la API ya no publica su puerto; se entra por acá)
security:
  - keycloak: [openid]
tags:
  - name: Tiendas
  - name: Productos
paths:
  /tiendas:
    get:
      tags: [Tiendas]
      summary: Listar tiendas
      operationId: listarTiendas
      description: '**Rol requerido:** Cualquier rol'
      responses:
        '200':
          description: Lista de tiendas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tiendas'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
  /tiendas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          example: 1
    get:
      tags: [Tiendas]
      summary: Obtener una tienda
      operationId: obtenerTienda
      description: '**Rol requerido:** Cualquier rol'
      responses:
        '200':
          description: La tienda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tienda'
        '400':
          $ref: '#/components/responses/Invalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
  /productos:
    get:
      tags: [Productos]
      summary: Listar productos de una tienda
      operationId: listarProductos
      description: '**Rol requerido:** Cualquier rol'
      responses:
        '200':
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'
        '400':
          $ref: '#/components/responses/Invalido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
    post:
      tags: [Productos]
      summary: Crear un producto en la tienda del usuario
      operationId: crearProducto
      description: |
        **Rol requerido:** duenio

        El producto se crea en una tienda cuyo dueño es el usuario autenticado.
        Si el usuario tiene una sola tienda, `tiendaId` puede omitirse.
        Si tiene varias y no indica `tiendaId`, responde 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ProductoNuevo'
                - type: object
                  properties:
                    tiendaId:
                      type: integer
                      example: 1
                      description: |
                        Como el usuario es dueño de una sola tienda, se usa esa.
                      required: true
            example:
              nombre: Mate de madera
              precio: 1500.50
              stock: 10
      responses:
        '201':
          description: Producto creado en la tienda del usuario
          headers:
            Location:
              description: URI del producto creado
              schema:
                type: string
                example: /productos/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '400':
          $ref: '#/components/responses/Invalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: El usuario no tiene el rol duenio, no es dueño de ninguna tienda o no es dueño de la tienda indicada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Sin permiso
                status: 403
                detail: 'comprador tiene los roles [comprador] y esta operación requiere uno de [duenio].'
                instance: /productos
components:
  securitySchemes:
    keycloak:
      type: oauth2
      description: |
        OAuth 2.0 / OpenID Connect con Keycloak. Flujo Authorization Code con PKCE (cliente público "swagger-ui").
        Documento de descubrimiento OIDC: http://localhost:8180/realms/incubadora-universitaria/.well-known/openid-configuration
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8180/realms/incubadora-universitaria/protocol/openid-connect/auth
          tokenUrl: http://localhost:8180/realms/incubadora-universitaria/protocol/openid-connect/token
          scopes:
            openid: Identidad del usuario (OIDC)
            profile: Nombre y usuario
  schemas:
    Tienda:
      type: object
      required: [id, nombre]
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Tienda de mates unahur
    ProductoNuevo:
      type: object
      required: [nombre, precio, stock]
      properties:
        nombre:
          type: string
          example: Mate de madera
          nullable: false
        precio:
          type: number
          format: float
          example: 1500.50
          nullable: false
        stock:
          type: integer
          example: 10
          nullable: false
    Producto:
      allOf:
        - $ref: '#/components/schemas/ProductoNuevo'
        - type: object
          required: [id, tiendaId,tiendaNombre]
          properties:
            id:
              type: integer
              example: 1
            tiendaId:
              type: integer
              example: 1
            tiendaNombre:
              type: string
              example: Tienda de mates unahur
    ProblemDetails:
      description: Formato de error estándar (RFC 9457, antes RFC 7807)
      type: object
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Tienda no encontrada
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: No existe una tienda con id 99.
        instance:
          type: string
          example: /tiendas/99
  responses:
    NoEncontrado:
      description: El recurso no existe
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Invalido:
      description: Datos de entrada inválidos
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NoAutenticado:
      description: Falta el token, está vencido o su firma no es válida (no sé quién sos)
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer realm="incubadora-universitaria"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: about:blank
            title: No autenticado
            status: 401
            detail: 'Falta el header "Authorization: Bearer <token>".'
            instance: /tiendas
    SinPermiso:
      description: El token es válido pero el rol no alcanza para esta operación (sé quién sos, pero no podés)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: about:blank
            title: Sin permiso
            status: 403
            detail: 'comprador tiene los roles comprador y esta operación requiere uno de [duenio].'
            instance: /productos
